<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 11 Practice Lab</title><style>:root{--p:#4f2d7f;--g:#f5b800;--ok:#e9f6e6;--bad:#fdeaea}*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f7f7fb;line-height:1.45}header{background:var(--p);color:white;padding:22px;border-bottom:5px solid var(--g)}.wrap{max-width:1100px;margin:auto;padding:24px}.card,.student{background:white;border:2px solid var(--p);border-radius:14px;padding:24px;margin-bottom:24px}.student{display:grid;grid-template-columns:2fr 1fr;gap:20px}.student h2,.student p,.startrow{grid-column:1/-1}.tabs{display:none;gap:10px;flex-wrap:wrap;margin:18px 0}.tabs.show{display:flex}button{background:var(--p);color:white;border:2px solid var(--g);border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}input,select,textarea{width:100%;padding:11px;border:2px solid #bbb;border-radius:8px;font-size:16px}.lesson{display:none}.lesson.active{display:block}.q{border-top:1px solid #ddd;padding:24px 0}.opts{margin:12px 0 20px}.opts label{display:flex;gap:10px;padding:8px}.opts input{width:18px;height:18px}.feedback{font-weight:700;margin-top:12px}.good{color:#176b2c}.bad{color:#8b1a1a}.codebox{background:var(--p);color:white;padding:22px;border:2px solid var(--g);border-radius:12px}.codebox textarea{font-family:Consolas;min-height:180px;background:white;color:#111}.retry{background:#fff4cf;color:#111;padding:13px;margin:14px 0;border-left:5px solid var(--g)}.codebox button{width:100%;margin-top:16px}.codebox .feedback{background:white;color:#111;padding:13px;border-radius:8px}.codebox .feedback.good{background:var(--ok);color:#176b2c}.codebox .feedback.bad{background:var(--bad);color:#7d1616}.nav{display:flex;justify-content:space-between;margin-top:28px}.final{font-size:22px;font-weight:bold}.error{color:#8b1a1a;font-weight:bold}@media(max-width:650px){.student{grid-template-columns:1fr}}</style></head><body><header><h1>Chapter 11 — Working with Strings Practice Lab</h1><div>Character Data • String Functions • Input Validation</div></header><div class="wrap"><section id="start" class="student"><h2>Student Information</h2><p>Enter your information before beginning.</p><div><b>First and Last Name</b><input id="name"></div><div><b>Class Period</b><select id="period"><option value="">Choose...</option><option>1st Block</option><option>2nd Block</option><option>3rd Block</option><option>4th Block</option></select></div><div class="startrow"><div id="err" class="error"></div><button type="button" onclick="begin()">Begin Practice Lab →</button></div></section><div id="tabs" class="tabs"><button type="button" onclick="show(0)">Lesson 1</button><button type="button" onclick="show(1)">Lesson 2</button><button type="button" onclick="show(2)">Lesson 3</button><button type="button" onclick="show(3)">Finish</button></div><div id="lessons"></div></div><iframe name="hiddenFrame" style="display:none"></iframe><script>const lessons=[{title:'Lesson 1 — Character Data',qs:[['Given food = "PIZZA", what is food[1]?',['P','I','Z','A'],1,'Index 1 is the second character: I.'],['What is the last valid index of a string with length 5?',['3','4','5','6'],1,'Last index is length - 1, so 4.'],['What happens with food[1] = "Q" when food is a string?',['It changes I to Q','It causes an error because strings are immutable','It deletes I','It changes the whole string automatically'],1,'Strings are immutable.'],['What does len("PIZZA") return?',['4','5','6','0'],1,'len() returns the number of characters.'],['Which escape sequence creates a new line?',['\\t','\\n','\\"','\\\\'],1,'\\n represents a new line.']],code:{prompt:'Write code that stores "Giraffe" in a variable named word, stores its length in length, then prints the first and last characters using indexes.',hint:'Use word = "Giraffe", length = len(word), print(word[0]), and print(word[length - 1]).',check:c=>/word\s*=\s*["']Giraffe["']/i.test(c)&&/length\s*=\s*len\s*\(\s*word\s*\)/i.test(c)&&/print\s*\(\s*word\s*\[\s*0\s*\]\s*\)/i.test(c)&&/print\s*\(\s*word\s*\[\s*length\s*-\s*1\s*\]\s*\)/i.test(c)}},{title:'Lesson 2 — String Functions',qs:[['Which function returns the first index of a substring or -1 if it is not found?',['str.find()','str.index()','str.count()','str.split()'],0,'find() returns -1 when not found.'],['What does str.upper("pizza") return?',['Pizza','PIZZA','pizza','pIzZa'],1,'upper() creates uppercase text.'],['What does str.split() return by default?',['One string','A list of pieces separated by whitespace','An integer','A Boolean'],1,'split() returns a list of pieces.'],['Given food = "PIZZA", what does food[:2] return?',['PI','P','IZ','PIZ'],0,'Stop index 2 is excluded.'],['What does str.strip("  SODAS  ") do?',['Removes all S letters','Removes whitespace from both ends','Removes middle characters','Converts to lowercase'],1,'strip() removes leading/trailing whitespace.']],code:{prompt:'Store address = "123 Main Street, Anywhere, GA, 30004", split it on commas into fields, strip whitespace from each field using a numeric-index loop, then print fields.',hint:'Use str.split(address, ","), range(0, len(fields)), str.strip(fields[i]), and fields[i] = field.',check:c=>/address\s*=/.test(c)&&/str\.split\s*\(\s*address/i.test(c)&&/for\s+\w+\s+in\s+range/i.test(c)&&/str\.strip/i.test(c)&&/fields\s*\[/.test(c)&&/print\s*\(\s*fields\s*\)/i.test(c)}},{title:'Lesson 3 — Input Validation',qs:[['What happens if int() receives text that is not a valid integer?',['It returns 0','It raises ValueError','It returns the text unchanged','It returns False'],1,'Invalid numeric conversion can raise ValueError.'],['Where should risky statements go when using try/except?',['Under except','Before try','Indented under try','After finally'],2,'Risky statements belong inside try.'],['If an exception happens inside try, what does except do?',['Runs its block','Restarts Python','Skips the entire program','Converts input automatically'],0,'except handles the error.'],['To verify input is numeric AND between 1 and 10, what should you use?',['Only try/except','Only if/else','Both try/except and conditional logic','Neither'],2,'Type and range validation need different checks.'],['Why surround validation with a loop?',['To ask again until valid or attempts run out','To make the program random','To avoid all conditions','To convert strings into lists'],0,'Loops allow retries.']],code:{prompt:'Write a validation loop that gives up to 3 attempts. Ask for ssn as a string, require len(ssn) == 9, and use int(ssn) inside try to verify numeric characters. Break when valid.',hint:'Use for ... range(3), len(ssn) == 9, try: int(ssn), except:, and break.',check:c=>/for\s+\w+\s+in\s+range\s*\(\s*3\s*\)/i.test(c)&&/ssn\s*=\s*input/i.test(c)&&/len\s*\(\s*ssn\s*\)\s*==\s*9/i.test(c)&&/try\s*:/i.test(c)&&/int\s*\(\s*ssn\s*\)/i.test(c)&&/except(?:\s+\w+)?\s*:/i.test(c)&&/break/i.test(c)}}];function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function prepQuestion(q){let correct=q[1][q[2]],answers=shuffle([...q[1]]);return[q[0],answers,answers.indexOf(correct),q[3]]}lessons.forEach(L=>{L.qs=shuffle(L.qs.map(prepQuestion))});let started=false,scores=lessons.map(L=>({mc:Array(L.qs.length).fill(false),code:false}));function build(){let root=document.getElementById('lessons');lessons.forEach((L,li)=>{let d=document.createElement('section');d.className='lesson card';d.innerHTML=`<h2>${L.title}</h2><p>Questions 1–5 and their answer choices are randomized each time the lab starts. You may retry missed items.</p>`;L.qs.forEach((q,qi)=>{let x=document.createElement('div');x.className='q';x.innerHTML=`<b>${qi+1}. ${q[0]}</b><div class="opts">${q[1].map((o,oi)=>`<label><input type="radio" name="q${li}_${qi}" value="${oi}"><span>${o}</span></label>`).join('')}</div><button type="button" onclick="checkMC(${li},${qi})">Check Answer</button><div id="f${li}_${qi}" class="feedback"></div>`;d.appendChild(x)});let c=document.createElement('div');c.className='codebox';c.innerHTML=`<h3>Coding Check — 5 points</h3><p>${L.code.prompt}</p><div class="retry"><b>Retry allowed:</b> Fix your code and click Check My Code again until it passes.</div><textarea id="code${li}"></textarea><button type="button" id="codeBtn${li}">Check My Code</button><div id="cf${li}" class="feedback"></div>`;d.appendChild(c);let nav=document.createElement('div');nav.className='nav';nav.innerHTML=`${li?`<button type="button" onclick="show(${li-1})">← Previous Lesson</button>`:`<button type="button" onclick="location.reload()">↻ Start Over</button>`}<button type="button" onclick="show(${li+1})">Next Lesson →</button>`;d.appendChild(nav);root.appendChild(d);document.getElementById('codeBtn'+li).addEventListener('click',function(e){e.preventDefault();checkCode(li)})});let f=document.createElement('section');f.className='lesson card';f.innerHTML=`<h2>Finish & Submit</h2><div class="final">Points: <span id="pts">0</span>/90 | Grade: <span id="grade">0%</span></div><p id="msg"></p><button type="button" onclick="submitWork()">Submit My Work</button><div class="nav"><button type="button" onclick="show(2)">← Previous Lesson</button></div>`;root.appendChild(f)}function begin(){let n=document.getElementById('name').value.trim(),p=document.getElementById('period').value;if(!n||!p){document.getElementById('err').textContent='Enter first and last name and choose a class period.';return}started=true;document.getElementById('start').style.display='none';document.getElementById('tabs').classList.add('show');show(0)}function show(n){if(!started)return;n=Math.max(0,Math.min(3,n));document.querySelectorAll('.lesson').forEach((e,i)=>e.classList.toggle('active',i===n));update();scrollTo({top:0,behavior:'smooth'})}function checkMC(li,qi){let a=document.querySelector(`input[name=q${li}_${qi}]:checked`),f=document.getElementById(`f${li}_${qi}`);if(!a){f.className='feedback bad';f.textContent='Choose an answer first.';return}let ok=+a.value===lessons[li].qs[qi][2];scores[li].mc[qi]=ok;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✓ Correct! ':'✗ Not quite. ')+lessons[li].qs[qi][3]+(ok?'':' Change your answer and try again.');update()}function checkCode(li){const box=document.getElementById('code'+li);const f=document.getElementById('cf'+li);const c=box.value;let ok=false;try{ok=Boolean(lessons[li].code.check(c))}catch(err){ok=false}scores[li].code=ok;f.className='feedback '+(ok?'good':'bad');if(ok){f.textContent='✓ Code check passed!'}else{f.textContent='✗ Not quite. '+lessons[li].code.hint+' Fix your code above, then click Check My Code again. You can retry as many times as needed.'}box.readOnly=false;box.disabled=false;const btn=document.getElementById('codeBtn'+li);btn.disabled=false;btn.style.pointerEvents='auto';update();box.focus()}function total(){return scores.reduce((s,L)=>s+L.mc.filter(Boolean).length*5+(L.code?5:0),0)}function update(){let p=total(),pct=Math.round(p/90*1000)/10;if(document.getElementById('pts'))document.getElementById('pts').textContent=p;if(document.getElementById('grade'))document.getElementById('grade').textContent=pct+'%'}function submitWork(){let p=total(),pct=Math.round(p/90*1000)/10+'%',form=document.createElement('form');form.method='POST';form.action='https://docs.google.com/forms/d/e/1FAIpQLSf9qAF0Ek04CLXOzReYWO-5YVDfY70LYoWWMLaLyC0bG70YUg/formResponse';form.target='hiddenFrame';let data={'entry.2089413779':document.getElementById('name').value.trim(),'entry.890934651':document.getElementById('period').value,'entry.646173439':'Chapter 11 | Working with Strings','entry.962158861':p+'/90 | '+pct};for(let k in data){let i=document.createElement('input');i.type='hidden';i.name=k;i.value=data[k];form.appendChild(i)}document.body.appendChild(form);form.submit();form.remove();document.getElementById('msg').innerHTML='<b>Submitted!</b> '+p+'/90 — '+pct}build();</script></body></html>
