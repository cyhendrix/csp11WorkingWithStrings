<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 11 | Working with Strings Practice Lab</title><style>:root{--p:#4f2d7f;--g:#f5b800;--ink:#082d5b;--bg:#f7f7fb;--ok:#e9f6e6;--bad:#fdeaea;--cream:#fff4cf}*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:var(--bg);color:#111;line-height:1.45}header{background:var(--p);color:#fff;padding:22px 20px;border-bottom:5px solid var(--g)}header h1{margin:0 0 8px}.wrap{max-width:1100px;margin:auto;padding:24px 20px 40px}.card,.student{background:#fff;border:2px solid var(--p);border-radius:14px;padding:24px;margin-bottom:24px}.student{display:grid;grid-template-columns:2fr 1fr;gap:20px}.student h2,.student p,.startrow{grid-column:1/-1}.startrow{text-align:right}.starterror{color:#8b1a1a;font-weight:700;margin:10px 0}.tabs{display:none;gap:10px;flex-wrap:wrap;margin:18px 0 24px}.tabs.show{display:flex}.tabs button,.nav button,.check,.submit,.startbtn{background:var(--p);color:#fff;border:2px solid var(--g);border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}.tabs button.active{background:var(--ink)}label{font-weight:700}input,select,textarea{width:100%;padding:11px;border:2px solid #bbb;border-radius:8px;font-size:16px}.lesson{display:none}.lesson.active{display:block}.q{border-top:1px solid #ddd;padding:24px 0 28px}.q:first-of-type{border-top:0}.q>b{display:block;margin-bottom:14px;font-size:17px}.opts{margin:6px 0 22px}.opts label{display:flex;align-items:flex-start;gap:10px;font-weight:400;padding:8px 6px;cursor:pointer}.opts input[type=radio]{width:18px;height:18px;min-width:18px;flex:0 0 18px;margin:2px 0 0}.feedback{font-weight:700;margin-top:12px}.good{color:#176b2c}.bad{color:#8b1a1a}.q .check{display:block;margin-top:22px}.codebox{background:var(--p);color:#fff;padding:22px;border-radius:12px;border:2px solid var(--g);margin-top:16px}.codebox textarea{font-family:Consolas,monospace;min-height:180px;background:#fff;color:#111;margin:6px 0 18px}.retry{background:var(--cream);color:#111;border-left:5px solid var(--g);padding:13px 15px;margin:14px 0 18px}.codebox .check{display:block;width:100%}.codebox .feedback{margin-top:16px;padding:13px 15px;border-radius:9px;background:#fff;color:#111}.codebox .feedback.good{background:var(--ok);color:#176b2c;border:2px solid #78b982}.codebox .feedback.bad{background:var(--bad);color:#7d1616;border:2px solid #d58b8b}.nav{display:flex;justify-content:space-between;gap:16px;margin-top:28px}.final{font-size:22px;font-weight:700;margin:20px 0}.small{font-size:14px;color:#444}.pill{display:inline-block;background:var(--g);padding:5px 10px;border-radius:999px;font-weight:700}@media(max-width:650px){.student{grid-template-columns:1fr}.wrap{padding:16px 12px 30px}.student,.card{padding:18px}}</style></head><body><header><h1>Chapter 11 — Working with Strings Practice Lab</h1><div>Character Data • String Functions • Input Validation</div></header><div class="wrap"><section id="startPage" class="student"><h2>Student Information</h2><p>Enter your information before beginning the practice lab.</p><div><label>First and Last Name</label><input id="studentName" placeholder="Enter first and last name"></div><div><label>Class Period</label><select id="period"><option value="">Choose...</option><option>1st Block</option><option>2nd Block</option><option>3rd Block</option><option>4th Block</option></select></div><div class="startrow"><div id="startError" class="starterror"></div><button class="startbtn" onclick="beginLab()">Begin Practice Lab →</button></div></section><div id="tabs" class="tabs"><button onclick="showLesson(0)" class="active">Lesson 1</button><button onclick="showLesson(1)">Lesson 2</button><button onclick="showLesson(2)">Lesson 3</button><button onclick="showLesson(3)">Finish</button></div><div id="lessons"></div></div><iframe name="hiddenFrame" style="display:none"></iframe><script>const lessons=[{title:'Lesson 1 — Character Data',qs:[['Given food = "PIZZA", what is food[1]?',['P','I','Z','A'],1,'Index 1 is the second character: I.'],['What is the last valid index of a string with length 5?',['3','4','5','6'],1,'Last index is length - 1, so 4.'],['What happens with food[1] = "Q" when food is a string?',['It changes I to Q','It causes an error because strings are immutable','It deletes I','It changes the whole string automatically'],1,'Strings are immutable; individual characters cannot be assigned by index.'],['What does len("PIZZA") return?',['4','5','6','0'],1,'len() returns the number of characters.'],['Which escape sequence creates a new line?',['\\t','\\n','\\"','\\\\'],1,'\\n represents a new line.']],code:{prompt:'Write code that stores "Giraffe" in a variable named word, stores its length in length, then prints the first and last characters using indexes.',hint:'Use word[0] for the first character and word[length - 1] for the last.',check:c=>/word\s*=\s*["']Giraffe["']/i.test(c)&&/length\s*=\s*len\s*\(\s*word\s*\)/i.test(c)&&/word\s*\[\s*0\s*\]/i.test(c)&&/word\s*\[\s*length\s*-\s*1\s*\]/i.test(c)}},{title:'Lesson 2 — String Functions',qs:[['Which function returns the first index of a substring or -1 if it is not found?',['str.find()','str.index()','str.count()','str.split()'],0,'find() returns -1 when the substring is not found.'],['What does str.upper("pizza") return?',['Pizza','PIZZA','pizza','pIzZa'],1,'upper() creates an uppercase string.'],['What does str.split() return by default?',['One string','A list of pieces separated by whitespace','An integer','A Boolean'],1,'split() returns a list of pieces.'],['Given food = "PIZZA", what does food[:2] return?',['PI','P','IZ','PIZ'],0,'The stop index 2 is excluded, so indexes 0 and 1 are returned.'],['What does str.strip("  SODAS  ") do?',['Removes all S letters','Removes whitespace from both ends','Removes the middle characters','Converts to lowercase'],1,'strip() removes leading and trailing whitespace.']],code:{prompt:'Write code that stores address = "123 Main Street, Anywhere, GA, 30004", splits it on commas into fields, strips whitespace from each field using a numeric-index loop, then prints fields.',hint:'Use str.split(address, ","), range(0, len(fields)), str.strip(fields[i]), and fields[i] = field.',check:c=>/address\s*=/.test(c)&&/fields\s*=\s*str\.split\s*\(\s*address\s*,\s*["'],["']\s*\)/i.test(c)&&/for\s+\w+\s+in\s+range\s*\(\s*0\s*,\s*len\s*\(\s*fields\s*\)/i.test(c)&&/str\.strip\s*\(\s*fields\s*\[/i.test(c)&&/fields\s*\[\s*\w+\s*\]\s*=/.test(c)&&/print\s*\(\s*fields\s*\)/i.test(c)}},{title:'Lesson 3 — Input Validation',qs:[['What happens if int() receives text that is not a valid integer?',['It returns 0','It raises ValueError','It returns the text unchanged','It returns False'],1,'Invalid numeric conversion can raise ValueError.'],['Where should risky statements go when using try/except?',['Under except','Before try','Indented under try','After finally'],2,'Risky statements belong inside the try block.'],['If an exception happens inside try, what does except do?',['Runs its block','Restarts Python','Skips the entire program','Converts the input automatically'],0,'except handles the error.'],['To verify input is numeric AND between 1 and 10, what should you use?',['Only try/except','Only if/else','Both try/except and conditional logic','Neither'],2,'Type validation and range validation require different checks.'],['Why surround validation with a loop?',['To ask again until valid or attempts run out','To make the program random','To avoid all conditions','To convert strings into lists'],0,'Loops allow retries.']],code:{prompt:'Write a validation loop that gives up to 3 attempts. Ask for ssn as a string, require len(ssn) == 9, and use int(ssn) inside try to verify numeric characters. Break when valid.',hint:'Use for ... range(3), len(ssn) == 9, try: int(ssn), except:, and break.',check:c=>/for\s+\w+\s+in\s+range\s*\(\s*3\s*\)/i.test(c)&&/ssn\s*=\s*input/i.test(c)&&/len\s*\(\s*ssn\s*\)\s*==\s*9/i.test(c)&&/try\s*:/i.test(c)&&/int\s*\(\s*ssn\s*\)/i.test(c)&&/except\s*:/i.test(c)&&/break/i.test(c)}}];function shuffleQuestion(q){const correct=q[1][q[2]],a=[...q[1]];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return[q[0],a,a.indexOf(correct),q[3]]}lessons.forEach(L=>L.qs=L.qs.map(shuffleQuestion));let started=false;let scores=Array(3).fill(0).map(()=>({mc:[false,false,false,false,false],code:false}));function build(){const root=document.getElementById('lessons');lessons.forEach((L,li)=>{let d=document.createElement('section');d.className='lesson card';d.innerHTML=`<span class="pill">Lesson ${li+1}</span><h2>${L.title}</h2><p class="small">Each multiple-choice question is worth 5 points. The coding check is worth 5 points. Answer choices are randomized when the lab opens. You may retry missed items.</p>`;L.qs.forEach((q,qi)=>{let x=document.createElement('div');x.className='q';x.innerHTML=`<b>${qi+1}. ${q[0]}</b><div class="opts">${q[1].map((o,oi)=>`<label><input type="radio" name="q${li}_${qi}" value="${oi}"><span>${o}</span></label>`).join('')}</div><button class="check" onclick="checkMC(${li},${qi})">Check Answer</button><div id="f${li}_${qi}" class="feedback"></div>`;d.appendChild(x)});let c=document.createElement('div');c.className='codebox';c.innerHTML=`<h3>Coding Check — 5 points</h3><p>${L.code.prompt}</p><div class="retry"><b>Retry allowed:</b> If your code is not correct, fix it and click Check My Code again.</div><textarea id="code${li}" placeholder="Type your complete Python code here..."></textarea><button class="check" onclick="checkCode(${li})">Check My Code</button><div id="cf${li}" class="feedback"></div>`;d.appendChild(c);const left=li===0?`<button onclick="startOver()">↻ Start Over</button>`:`<button onclick="showLesson(${li-1})">← Previous Lesson</button>`;d.innerHTML+=`<div class="nav">${left}<button onclick="showLesson(${li+1})">Next Lesson →</button></div>`;root.appendChild(d)});let f=document.createElement('section');f.className='lesson card';f.innerHTML=`<h2>Finish & Submit</h2><p>Complete all three lessons before submitting.</p><div class="final">Points: <span id="pts">0</span>/90 &nbsp; | &nbsp; Grade: <span id="grade">0%</span></div><p id="submitMsg"></p><button class="submit" onclick="submitWork()">Submit My Work</button><div class="nav"><button onclick="showLesson(2)">← Previous Lesson</button><span></span></div>`;root.appendChild(f)}function beginLab(){let n=document.getElementById('studentName').value.trim(),p=document.getElementById('period').value,e=document.getElementById('startError');if(!n||!p){e.textContent='Please enter your first and last name and choose your class period before continuing.';return}started=true;e.textContent='';document.getElementById('startPage').style.display='none';document.getElementById('tabs').classList.add('show');showLesson(0)}function showLesson(n){if(!started)return;if(n<0)n=0;if(n>3)n=3;document.querySelectorAll('.lesson').forEach((e,i)=>e.classList.toggle('active',i===n));document.querySelectorAll('.tabs button').forEach((e,i)=>e.classList.toggle('active',i===n));if(n===3)update();window.scrollTo({top:0,behavior:'smooth'})}function startOver(){location.reload()}function checkMC(li,qi){let a=document.querySelector(`input[name=q${li}_${qi}]:checked`),f=document.getElementById(`f${li}_${qi}`);if(!a){f.className='feedback bad';f.textContent='Choose an answer first.';return}let ok=+a.value===lessons[li].qs[qi][2];scores[li].mc[qi]=ok;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✓ Correct! ':'✗ Not quite. ')+lessons[li].qs[qi][3]+(ok?'':' Change your answer and try again.');update()}function checkCode(li){let c=document.getElementById('code'+li).value,f=document.getElementById('cf'+li),ok=lessons[li].code.check(c);scores[li].code=ok;f.className='feedback '+(ok?'good':'bad');f.textContent=ok?'✓ Code check passed!':'✗ Not quite. '+lessons[li].code.hint+' Fix your code above and check again.';update()}function total(){return scores.reduce((s,L)=>s+L.mc.filter(Boolean).length*5+(L.code?5:0),0)}function update(){let p=total(),pct=Math.round((p/90)*1000)/10;document.getElementById('pts').textContent=p;document.getElementById('grade').textContent=pct+'%'}function submitWork(){let name=document.getElementById('studentName').value.trim(),period=document.getElementById('period').value,p=total(),pct=(Math.round((p/90)*1000)/10)+'%';let form=document.createElement('form');form.method='POST';form.action='https://docs.google.com/forms/d/e/1FAIpQLSf9qAF0Ek04CLXOzReYWO-5YVDfY70LYoWWMLaLyC0bG70YUg/formResponse';form.target='hiddenFrame';let data={'entry.2089413779':name,'entry.890934651':period,'entry.646173439':'Chapter 11 | Working with Strings','entry.962158861':p+'/90 | '+pct};Object.entries(data).forEach(([k,v])=>{let i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;form.appendChild(i)});document.body.appendChild(form);form.submit();form.remove();document.getElementById('submitMsg').innerHTML=`<b>Submitted!</b> ${name} — ${period} — ${p}/90 — ${pct}` }build();</script></body></html>
